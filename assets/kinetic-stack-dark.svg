<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc"><title id="title">Python, PyTorch, LoRA, ONNX, React and Next.js, React Native</title><desc id="desc">Research, model adaptation, inference, web, and mobile development.</desc><style>
